name: Sync static product pages

# Whenever data/products.json changes on GitHub, refresh the stock status
# in products/*/index.html so Google sees the same thing customers do.
on:
  push:
    paths:
      - "data/products.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync_static_pages.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add products
          git diff --cached --quiet || (git commit -m "Sync static product pages with products.json" && git push)
